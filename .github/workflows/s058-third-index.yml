name: 'PDIC S058 integrated third-index proof and kernel profile'
on:
  push:
    branches:
      - diagnostic/s058-third-index-partition
      - diagnostic/s059-remaining-positive-pairs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  third-index-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cat lean-toolchain
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Reject untrusted original package proof terms
        run: |
          set -euo pipefail
          if grep -nE '(^|[^A-Za-z])(sorry|admit|native_decide)([^A-Za-z]|$)|^[[:space:]]*(axiom|constant)[[:space:]]' PDIC.lean S024.lean Solution.lean; then
            echo 'Untrusted S058 package proof'; exit 1
          fi
      - name: Compile unchanged complete flagship and modified S024 proof
        run: |
          set -euo pipefail
          mkdir -p s058-evidence
          git rev-parse HEAD > s058-evidence/source-sha.txt
          lake build Challenge PDIC S024 Solution > s058-evidence/build.log 2>&1 || {
            tail -n 120 s058-evidence/build.log
            exit 1
          }
          lake env lean Solution.lean > s058-evidence/axioms.log 2>&1 || {
            tail -n 90 s058-evidence/axioms.log
            exit 1
          }
          if grep -E 'sorryAx|Lean.ofReduceBool|Lean.trustCompiler' s058-evidence/{build,axioms}.log; then
            echo 'Unapproved axiom'; exit 1
          fi
          grep -F 'palomar_complete_probability_and_spider' s058-evidence/axioms.log | tail -n 1
      - name: Independent finite original-predicate audits
        run: |
          set -euo pipefail
          python3 scripts/verify_s058_third_shards.py
          python3 scripts/verify_s024_normal_form.py
          python3 scripts/verify_s024_orbit.py
          python3 scripts/verify_s025_basis.py
          python3 scripts/verify_s023_all_caps.py
      - name: Profile independent exported Lean kernel roots
        run: bash scripts/s058_integrated_kernel_profile.sh
      - name: Save exact-source proof and memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s058-integrated-third-index-evidence
          retention-days: 14
          if-no-files-found: warn
          path: s058-evidence/**
