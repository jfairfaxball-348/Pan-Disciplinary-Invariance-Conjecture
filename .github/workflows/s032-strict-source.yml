name: S032 strict repackaged Lean source
on:
  push:
    branches:
      - session/s032-palomar-full-flagship
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and fetch cache
        run: |
          lake update
          lake exe cache get
      - name: Build complete module graph and print axioms
        run: |
          set -euo pipefail
          (lake build && lake env lean Solution.lean) 2>&1 | tee s032-lean.log
          if grep -E 'sorryAx|Lean.ofReduceBool|Lean.trustCompiler' s032-lean.log; then exit 1; fi
      - name: Reject source proof holes outside Challenge
        run: |
          if grep -nE '(^|[^A-Za-z])(sorry|admit|native_decide)([^A-Za-z]|$)|^[[:space:]]*(axiom|constant)[[:space:]]' PDIC.lean S024.lean Solution.lean; then exit 1; fi
      - name: Independent finite cross-checks
        run: |
          set -euo pipefail
          for script in scripts/verify_*.py; do python3 "$script"; done
