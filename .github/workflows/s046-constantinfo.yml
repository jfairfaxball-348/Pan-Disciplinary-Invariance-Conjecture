name: S046 independent eight-constant structural audit
on:
  push:
    branches:
      - diagnostic/s046-constantinfo-check
  workflow_dispatch:
permissions:
  contents: read
jobs:
  constantinfo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source
        run: |
          git rev-parse HEAD
          cat lean-toolchain
          sha256sum Challenge.lean PDIC.lean
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib cache
        run: |
          lake update
          lake exe cache get
      - name: Build independent Challenge and complete PDIC definitions
        run: |
          set -euo pipefail
          lake build Challenge PDIC
      - name: Export and compare eight separate compiled ConstantInfo declarations
        run: |
          set -euo pipefail
          lake env lean diagnostics/S043DumpChallenge.lean
          lake env lean diagnostics/S043DumpPDIC.lean
          python3 diagnostics/s043_compare.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("diagnostics/S043_EXPORTED_CONST_DIFF.json").read_text())["constants"]
          assert len(data) == 8, list(data)
          bad = [name for name, item in data.items() if not item["equal_repr"]]
          print("Independent ordinary-ConstantInfo mismatches:", bad)
          assert not bad, bad
          PY
      - name: Reject holes in proof sources
        run: |
          set -euo pipefail
          if grep -nE '(^|[^A-Za-z])(sorry|admit|native_decide)([^A-Za-z]|$)|^[[:space:]]*(axiom|constant)[[:space:]]' PDIC.lean S024.lean Solution.lean; then
            exit 1
          fi
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s046-eight-constantinfo-diff
          path: |
            diagnostics/S043_EXPORTED_CONST_DIFF.json
            diagnostics/s043-*.txt
          if-no-files-found: ignore
          retention-days: 14
