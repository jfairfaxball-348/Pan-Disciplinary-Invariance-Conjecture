name: S049 isolated Comparator stage-memory diagnostic
on:
  push:
    branches:
      - diagnostic/s049-comparator-load-profile
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Pin toolchain and recover dependency cache
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cat lean-toolchain
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build same actual full Solution
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake build Solution Challenge
      - name: Export exact Palomar theorem root from each independent module
        run: |
          set -euo pipefail
          # Identical export root selection to the pinned v4.35.0-rc3
          # src/lake/Lake/CLI/Check.lean compareIt / primitiveTargets /
          # builtinTargets. Exporting the flagship root alone is NOT an
          # official Comparator input and made S050's compare a false failure.
          export_roots=(
            Quot Quot.mk Quot.lift Quot.ind
            PDIC.palomar_complete_probability_and_spider
            propext Quot.sound Classical.choice
            Nat.add Nat.sub Nat.mul Nat.pow Nat.gcd
            Nat.div Nat.mod Nat.beq Nat.ble
            Nat.land Nat.lor Nat.xor Nat.shiftLeft Nat.shiftRight
            String.ofList Char.ofNat List eagerReduce Nat
            String String.mk Char optParam autoParam semiOutParam outParam
          )
          printf '%s\n' "${export_roots[@]}" > s049-export-roots.txt
          lake env leanexport Challenge -- "${export_roots[@]}" > s049-challenge.ndjson
          lake env leanexport Solution -- "${export_roots[@]}" > s049-solution.ndjson
          wc -c -l s049-challenge.ndjson s049-solution.ndjson
      - name: Isolate parser and traversal peak memory
        run: |
          # GitHub's shell starts with -e; 'set -uo' does not disable it.
          # Capture each diagnostic error and continue through independent stages.
          set +e
          set -uo pipefail
          failures=0
          printf 'S049 SHA=%s toolchain=%s\n' "$GITHUB_SHA" "$(cat lean-toolchain)"
          if [ -r /sys/fs/cgroup/memory.max ]; then
            printf 'cgroup memory.max='; cat /sys/fs/cgroup/memory.max
          elif [ -r /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
            printf 'cgroup v1 memory limit='; cat /sys/fs/cgroup/memory/memory.limit_in_bytes
          else
            echo 'cgroup memory limit not exposed on this GitHub-hosted runner'
          fi
          for stage in baseline challenge solution both compare axioms; do
            echo "::group::S049 stage $stage"
            echo "stage=$stage" | tee -a s049-outcomes.txt
            /usr/bin/time -v -o "s049-${stage}-rss.txt" \
              timeout --signal=TERM --kill-after=10s 600 \
              lake env lean --run diagnostics/s049_compare_stage_memory.lean \
              "$stage" s049-challenge.ndjson s049-solution.ndjson \
              > "s049-${stage}-log.txt" 2>&1
            rc=$?
            echo "rc=$rc" | tee -a s049-outcomes.txt
            if [ -f "s049-${stage}-log.txt" ]; then
              tail -c 12000 "s049-${stage}-log.txt" || true
            fi
            if [ -f "s049-${stage}-rss.txt" ]; then
              grep -E "Maximum resident set size|Elapsed \(wall clock\) time|Exit status" "s049-${stage}-rss.txt" || true
            fi
            if [ -r /sys/fs/cgroup/memory.events ]; then
              printf 'memory.events after %s: ' "$stage"
              tr '\n' ' ' < /sys/fs/cgroup/memory.events
              printf '\n'
            else
              echo 'memory.events unavailable (do not infer no OOM)'
            fi
            if [ "$rc" -ne 0 ]; then failures=$((failures + 1)); fi
            echo "::endgroup::"
            if [ "$rc" -eq 137 ] || [ "$rc" -eq 124 ]; then
              echo "stage $stage reached resource/time ceiling" | tee -a s049-outcomes.txt
            fi
          done
          echo "S049 diagnostic complete; stage failures=$failures; no result is a Palomar approval."
          if [ "$failures" -ne 0 ]; then exit 1; fi
      - name: Preserve only bounded diagnostic evidence, never 77MB exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s049-comparator-stage-memory-evidence
          retention-days: 14
          if-no-files-found: ignore
          path: |
            s049-outcomes.txt
            s049-export-roots.txt
            s049-*-rss.txt
            s049-*-log.txt
