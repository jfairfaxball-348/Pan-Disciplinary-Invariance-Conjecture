name: PDIC Lean kernel verification
on:
  push:
    branches: [main, session/s007-full-lean-flagship, session/s026-computable-orbit-ci]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Announce precise CI run on draft PR 4
        continue-on-error: true
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/session/s007-full-lean-flagship') || (github.event_name == 'pull_request' && github.head_ref == 'session/s025-ci-validation') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/issues/4/comments" --method POST \
            -f body="PDIC strict Lean verification STARTED for exact SHA \`$SHA\`: https://github.com/$REPO/actions/runs/$RUN_ID . Pending compiler/kernel results."
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib
        run: lake update
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Kernel-check PDIC declarations
        run: |
          set -euo pipefail
          (lake build && lake env lean S024.lean) 2>&1 | tee pdic-lean-build.log
          if grep -E 'sorryAx|_native|Lean.trustCompiler' pdic-lean-build.log; then
            echo "Rejected nonstandard axiom in Lean proof declarations"
            exit 1
          fi
      - name: Reject unapproved proof holes
        run: |
          if grep -nE '(^|[^A-Za-z])(sorry|admit|native_decide)([^A-Za-z]|$)|^[[:space:]]*(axiom|constant)[[:space:]]' PDIC.lean S024.lean; then
            echo "Forbidden proof hole or custom axiom in Lean source"
            exit 1
          fi
      - name: Run all independent finite checkers
        run: |
          exec > >(tee -a pdic-finite-checkers.log) 2>&1
          python3 scripts/verify_s000.py
          python3 scripts/verify_s001_independent.py
          python3 scripts/verify_s002.py
          python3 scripts/verify_s003r.py
          python3 scripts/verify_s003r2.py
          python3 scripts/verify_s003r9.py
          python3 scripts/verify_s007.py
          python3 scripts/verify_s008.py

          python3 scripts/verify_s011.py
          python3 scripts/verify_s018_spider_distribution.py
          python3 scripts/verify_s023_all_caps.py
          python3 scripts/verify_s024_normal_form.py
          python3 scripts/verify_s024_orbit.py
          python3 scripts/verify_s025_basis.py
          python3 scripts/verify_s020_unordered_moments.py


      - name: Publish exact-source CI verdict to draft PR 4
        continue-on-error: true
        if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/session/s007-full-lean-flagship') || (github.event_name == 'pull_request' && github.head_ref == 'session/s025-ci-validation')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from textwrap import dedent
          status = os.environ['RESULT']
          sha = os.environ['SHA']
          repo = os.environ['REPO']
          run_id = os.environ['RUN_ID']
          body = [
              f'### Automated PDIC strict Lean verification — {status.upper()}',
              f'**Exact source SHA:** \`{sha}\`',
              f'**Workflow:** https://github.com/{repo}/actions/runs/{run_id}',
              'This message is posted by the GitHub Actions runner on the proof branch, not by a finite Python certificate.',
              ''
          ]
          for name in ['pdic-lean-build.log', 'pdic-finite-checkers.log']:
              path = Path(name)
              if path.exists():
                  txt = path.read_text(errors='replace')
                  sample = txt[-16000:].replace('```', '` ` `')
                  body.extend([f'**{name} (last 16000 characters)**', '```text', sample, '```', ''])
              else:
                  body.append(f'**{name}: not produced** (failure may have occurred during toolchain setup).')
          Path('pdic-ci-verdict.md').write_text('\n'.join(body))
          PY
          gh api "repos/$REPO/issues/4/comments" --method POST -F body=@pdic-ci-verdict.md
