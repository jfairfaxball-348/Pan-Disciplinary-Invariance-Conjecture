name: PDIC Lean kernel verification
on:
  push:
    branches: [main, session/s007-full-lean-flagship]
  pull_request:
  workflow_dispatch:
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib
        run: lake update
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Kernel-check PDIC declarations
        run: |
          set -euo pipefail
          lake build 2>&1 | tee pdic-lean-build.log
          if grep -E 'sorryAx|_native|Lean.trustCompiler' pdic-lean-build.log; then
            echo "Rejected nonstandard axiom in Lean proof declarations"
            exit 1
          fi
      - name: Reject unapproved proof holes
        run: |
          if grep -nE '(^|[^A-Za-z])(sorry|admit|native_decide)([^A-Za-z]|$)|^[[:space:]]*(axiom|constant)[[:space:]]' PDIC.lean; then
            echo "Forbidden proof hole or custom axiom in Lean source"
            exit 1
          fi
      - name: Run all ten independent finite checkers
        run: |
          python3 scripts/verify_s000.py
          python3 scripts/verify_s001_independent.py
          python3 scripts/verify_s002.py
          python3 scripts/verify_s003r.py
          python3 scripts/verify_s003r2.py
          python3 scripts/verify_s003r9.py
          python3 scripts/verify_s007.py
          python3 scripts/verify_s008.py

          python3 scripts/verify_s011.py
          python3 scripts/verify_s018_spider_distribution.py
