name: PDIC Lean kernel verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib
        run: lake update
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Kernel-check PDIC declarations
        run: lake build
      - name: Reject unapproved proof holes
        run: |
          if grep -nE '(^|[^A-Za-z])(sorry|admit|native_decide)([^A-Za-z]|$)|^[[:space:]]*(axiom|constant)[[:space:]]' PDIC.lean; then
            echo "Forbidden proof hole or custom axiom in Lean source"
            exit 1
          fi
      - name: Run pre-existing finite checks
        run: |
          python3 scripts/verify_s000.py
          python3 scripts/verify_s001_independent.py
          python3 scripts/verify_s002.py
          python3 scripts/verify_s003r.py
