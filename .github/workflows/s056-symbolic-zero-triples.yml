name: 'PDIC S056 symbolic zero-sum triple proof candidate'
on:
  push:
    branches:
      - diagnostic/s056-symbolic-zero-triples
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-and-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Lean toolchain
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cat lean-toolchain
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Reject source-level untrusted proof terms
        run: |
          set -euo pipefail
          if grep -nE '(^|[^A-Za-z])(sorry|admit|native_decide)([^A-Za-z]|$)|^[[:space:]]*(axiom|constant)[[:space:]]' PDIC.lean S024.lean Challenge.lean Solution.lean; then
            echo 'Rejected proof hole or untrusted axiom'
            exit 1
          fi
      - name: Compile unchanged flagship and profile changed zero-card certificates
        run: bash scripts/s056_symbolic_reprofile.sh
      - name: Run independent S024 finite checkers
        run: |
          set -euo pipefail
          python3 scripts/verify_s024_normal_form.py
          python3 scripts/verify_s024_orbit.py
          python3 scripts/verify_s025_basis.py
          python3 scripts/verify_s023_all_caps.py
      - name: Save exact source and bounded resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s056-symbolic-zero-triple-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            s056-symbolic-evidence/**
