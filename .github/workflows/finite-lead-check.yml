name: PDIC finite lead check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  finite-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check finite evidence (not a Lean proof)
        run: python3 scripts/verify_s000.py
      - name: Independently check S001 cap orbit and joint witness law
        run: python3 scripts/verify_s001_independent.py
      - name: Independently check S002 sharp spider and exact rational law
        run: python3 scripts/verify_s002.py
