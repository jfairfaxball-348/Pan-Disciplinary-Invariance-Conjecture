name: PDIC Palomar high-memory preflight (manual, authorised)
run-name: Approved 32GB Palomar preflight ${{ inputs.commit }}
# Manual-only. This requires a Namespace runner integration and may incur
# third-party charges. No trigger is installed for pushes or PRs.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact immutable 40-character theorem package commit"
        required: true
        type: string
        default: "c59cbeecd669d9a0ab5ba5f6e1e4021051a62c8a"
      authorize_namespace_spend:
        description: "I authorise a billable Namespace 16-vCPU/32-GB run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  owner-authorisation:
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit capacity cost authorisation and immutable source
        env:
          COMMIT: ${{ inputs.commit }}
          AUTHORISED: ${{ inputs.authorize_namespace_spend }}
        run: |
          set -euo pipefail
          if [[ "$AUTHORISED" != "true" ]]; then
            echo "::error::Namespace billing has not been authorised. No high-memory job was started."
            exit 1
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Commit must be a full lowercase 40-hex SHA."
            exit 1
          fi
          echo "Authorised official Palomar preflight on immutable commit $COMMIT"

  palomar-approved-32gb:
    needs: owner-authorisation
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: jfairfaxball-348/Pan-Disciplinary-Invariance-Conjecture
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: pdic32g${{ github.run_id }}
      mode: full
      execution_profile: palomar-namespace-16x32-v1
      options: '{"comparator_config_path":"comparator.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
