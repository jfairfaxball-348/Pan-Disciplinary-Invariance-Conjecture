status:
  scope: >-
    Exactly two named graph/matrix theorems are selected: the bound B(A)<=3
    under connectedness of matrixGraph A, and the if-and-only-if
    seven-edge row/column spider MATRIX pattern for equality. B(A) counts
    actual maximal independent vertex sets of 2+2 split. The manuscript's
    eight-cap quartet classification, arbitrary connected-graph compatible
    triple transport, complete probability law, and spider graph isomorphism
    are NOT compared or end-to-end formalized. The proof source is PDIC.lean,
    based on strictly checked S003R9 commit
    402465f2330a275e04108169a6bfbb65e94e10b8.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "A connected four-by-four bipartite matrix graph has at most three mixed maximal independent sets."
    - "Equality is equivalent to the defined row/column spider matrix pattern."
