version: "v0.4"
project:
  name: "Sharp Mixed Maximal-Independent-Set Bounds for Connected Four-by-Four Bipartite Graphs"
  description: >-
    We prove that for every connected simple bipartite graph represented by a
    Boolean four-by-four adjacency matrix A, the number B(A) of distinct
    inclusion-maximal independent vertex sets containing two vertices on each
    side is at most three: B(A) <= 3. Moreover, B(A) = 3 if and only if A has
    the explicitly defined row- or column-centred seven-edge spider matrix
    pattern. This Lean certificate covers a graph-theoretic component of
    the manuscript "Zero-Sum Quartet Incidence and Sharp Maximal-Independent-Set
    Witnesses on Eight Vertices"; it does not certify the full eight-cap
    zero-sum quartet probability distribution or a named spider graph
    isomorphism. Literature priority is unresolved.
